name: coursesphere-lab
x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment:
    APP_MODE: demo
    ALLOW_CONTAINER_BIND: 'yes'
    BIND_HOST: 0.0.0.0
    DEMO_DB_PATH: /data/demo.sqlite3
    DEMO_SIGNING_KEY: ${DEMO_SIGNING_KEY:?Run scripts/start_docker.sh to generate the local secret}
  volumes:
    - demo_data:/data
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private_net]
  pids_limit: 80
  mem_limit: 256m
services:
  api_a:
    <<: *api
    environment:
      APP_MODE: demo
      ALLOW_CONTAINER_BIND: 'yes'
      BIND_HOST: 0.0.0.0
      DEMO_DB_PATH: /data/demo.sqlite3
      DEMO_SIGNING_KEY: ${DEMO_SIGNING_KEY:?Missing secret}
      INSTANCE_ID: api-a
  api_b:
    <<: *api
    environment:
      APP_MODE: demo
      ALLOW_CONTAINER_BIND: 'yes'
      BIND_HOST: 0.0.0.0
      DEMO_DB_PATH: /data/demo.sqlite3
      DEMO_SIGNING_KEY: ${DEMO_SIGNING_KEY:?Missing secret}
      INSTANCE_ID: api-b
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api_a,api_b]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard:/usr/share/nginx/html/lab:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private_net]
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [private_net]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Missing Grafana secret}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [private_net]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  demo_data:
  prometheus_data:
  grafana_data:
networks:
  private_net:
    driver: bridge
