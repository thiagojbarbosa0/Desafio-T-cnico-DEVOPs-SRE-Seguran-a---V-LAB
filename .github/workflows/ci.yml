name: CourseSphere - verificacao essencial
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security, Firebase and quota contracts
        run: |
          python3 -m unittest tests.test_security_core tests.test_firebase_configuration_r6 tests.test_shared_quota_final tests.test_r14_scoped_fixture_cleanup tests.test_r14_proof_fail_closed -q
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
