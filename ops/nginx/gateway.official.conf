# Distinct from the synthetic lab gateway. Real upstream: backend/endpoints.py
upstream coursesphere_official_api {
    least_conn;
    server official_api_a:8091 max_fails=2 fail_timeout=5s;
    server official_api_b:8091 max_fails=2 fail_timeout=5s;
    keepalive 16;
}
server {
    listen 8081;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:9099 ws://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Block high-risk token-bearing query parameters at the edge, even on SPA paths.
    if ($args ~* "(^|&)(id(?:_|%5[fF])token|access(?:_|%5[fF])token|auth(?:_|%5[fF])token|api(?:_|%5[fF])key)=") { return 401; }

    # Original React API calls are /users/*, /chats/*, /hash; no /api prefix.
    location ~ ^/(users(?:/|$)|chats(?:/|$)|hash$|health$|ready$) {
        # This API does not require query strings; prevent logging/proxying them.
        if ($args != "") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://coursesphere_official_api;
    }
    location = /metrics { return 403; }
    location / { proxy_pass http://official_frontend:8082; }
}
