# The same privacy-preserving access-log contract is used in local Nginx proofs.
# Do not log $request, $request_uri, $args, Referer, or Authorization headers.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # A query-free, structured line; status, path and upstream are enough for SRE.
    log_format coursesphere_json escape=json
        '{"event":"edge_http","path":"$uri","method":"$request_method",'
        '"status":$status,"request_id":"$request_id",'
        '"upstream":"$upstream_addr","duration_sec":"$request_time"}';
    access_log /dev/stdout coursesphere_json;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    include /etc/nginx/conf.d/*.conf;
}
