upstream coursesphere_api {
    least_conn;
    server api_a:8091 max_fails=2 fail_timeout=5s;
    server api_b:8091 max_fails=2 fail_timeout=5s;
    keepalive 16;
}
server {
    listen 8080;
    server_tokens off;
    # Never forward token-bearing URLs. Query strings may reach proxy/access logs
    # before Flask can reject a request. This guard also protects older clients.
    if ($args ~* "(^|&)(id_token|access_token|auth_token|api_key)=") {
        return 401;
    }
    client_max_body_size 32k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location = / { return 302 /lab/; }
    location = /lab { return 302 /lab/; }
    location /lab/ {
        alias /usr/share/nginx/html/lab/;
        try_files $uri $uri/ /lab/index.html;
    }
    location /api/ {
        # Official Flask routes consume JSON bodies and Authorization headers;
        # no public API endpoint needs a query string. Reject ALL such URLs,
        # including percent-encoded credential key spellings, before proxying.
        if ($args != "") { return 400; }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://coursesphere_api;
    }
    location = /metrics { return 403; } # Metrics scrape-only on private Docker network
}
