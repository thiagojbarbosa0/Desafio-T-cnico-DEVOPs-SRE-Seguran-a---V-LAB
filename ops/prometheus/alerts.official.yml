groups:
  - name: coursesphere-original-slo
    rules:
      - alert: OriginalAPIReplicaUnavailable
        expr: up{job="coursesphere-original"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: CourseSphere original Flask replica is unavailable
      - alert: OriginalAPIAvailabilitySLO
        expr: |
          sum(rate(coursesphere_original_http_requests_total{status_class="5xx",route!~"/health|/ready"}[5m]))
          / clamp_min(sum(rate(coursesphere_original_http_requests_total{route!~"/health|/ready"}[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Original Flask 5xx rate exceeds 1 percent
      - alert: OriginalAPILatencySLO
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(coursesphere_original_http_duration_seconds_bucket{route!~"/health|/ready"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Original Flask p95 request time exceeds 500 ms
      - alert: OriginalAPIDependencyReadinessDegraded
        # Every authorized /metrics scrape probes Firebase Auth + RTDB on the
        # scraped replica and publishes 1/0. Missing replicas have their own
        # `up == 0` alert; do not use route traffic as a readiness proxy.
        expr: |
          coursesphere_original_firebase_ready{job="coursesphere-original"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: CourseSphere original Firebase Auth or RTDB readiness is degraded
      - alert: OriginalAPIReadinessTelemetryMissing
        # Distinguish a live replica running an OLD image without the new
        # readiness gauge from one that has actually demonstrated availability.
        expr: |
          up{job="coursesphere-original"} == 1
          unless on(job, instance) coursesphere_original_firebase_ready{job="coursesphere-original"}
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: CourseSphere replica is up but not publishing Firebase readiness evidence
